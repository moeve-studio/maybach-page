<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friesenhaus Muhle · Maybachstraße 26 · Sylt</title>
<meta name="description" content="Reetgedecktes Friesenhaus auf 1.338 m² Gartengrundstück, im Zentrum Westerlands. Privatverkauf.">
<meta property="og:title" content="Friesenhaus Muhle — Maybachstraße 26, Sylt">
<meta property="og:description" content="Reetgedeckt. 213 m² Wohnfläche, 1.338 m² Grundstück, in Bestlage.">
<meta property="og:image" content="images/ext-hero-pathway.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="design-system/colors_and_type.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --bg-cinema: #050505;
    --bg-credits: #0c0e14;
    --fg-credits: #f4ede0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg-cinema);
    color: #fff;
    scroll-behavior: smooth;
  }
  body {
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #050505; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; }
  ::-webkit-scrollbar-thumb:hover { background: #2a2a2a; }

  /* Letterbox bars — fixed, fade out when credits show */
  .letterbox {
    position: fixed; left: 0; right: 0;
    height: 3.5vh; min-height: 24px; max-height: 60px;
    background: #050505;
    z-index: 70;
    pointer-events: none;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .letterbox-top    { top: 0; }
  .letterbox-bottom { bottom: 0; }
  body.no-letterbox .letterbox-top    { opacity: 0; transform: translateY(-100%); }
  body.no-letterbox .letterbox-bottom { opacity: 0; transform: translateY(100%); }

  /* First-frame scroll cue */
  .cinema-scroll-line {
    width: 1px; height: 56px; background: rgba(255,255,255,0.4);
    margin: 10px 0 0 auto;
    animation: cinemaLine 2.6s ease-in-out infinite;
    transform-origin: top;
  }
  @keyframes cinemaLine {
    0%, 100% { transform: scaleY(1);    opacity: 0.4; }
    50%      { transform: scaleY(0.55) translateY(8px); opacity: 1; }
  }

  /* Credits responsive */
  @media (max-width: 820px) {
    .credits-grid { grid-template-columns: 1fr !important; gap: 48px !important; }
  }

  /* Print */
  @media print {
    .letterbox, nav { display: none !important; }
    section { break-inside: avoid; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="components-cinema.jsx"></script>

<script type="text/babel">

function Root() {
  // Toggle letterbox bars when entering the credits section
  React.useEffect(() => {
    const credits = document.getElementById('credits');
    if (!credits) return;
    const io = new IntersectionObserver(([entry]) => {
      document.body.classList.toggle('no-letterbox', entry.isIntersecting);
    }, { threshold: 0.05 });
    io.observe(credits);
    return () => io.disconnect();
  }, []);

  return <CinemaApp />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

</script>

</body>
</html>
